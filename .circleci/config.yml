version: 2.0

# Default actions to perform on each Emacs version
default: &default-steps
  steps:
    - restore_cache:
        name: Restore Emacs deps
        keys:
          - cask-{{checksum Cask}}
    - run:
        name: Update APT packages
        command: apt-get update
    - run:
        name: Install prerequisites
        command: apt-get install -y openjdk-17-jre make python3 git
    - checkout
    - run:
        # Note: this makes it hard to reproduce builds but easier to spot incompatibilities with
        # newer PlantUML releases. Current trade off seems acceptable.
        name: Download the latest PlantUML release
        command: sh ./bin/download-plantuml.sh
    - run:
        name: Install cask
        command: curl -fsSL https://raw.githubusercontent.com/cask/cask/master/go | python3
    - run:
        name: Make Cask available on the path
        command: echo 'export PATH="/root/.cask/bin:$PATH"' >> $BASH_ENV
    - run:
        name: Download Cask deps
        command: cask install
    - run:
        name: Run the tests
        command: make unit
    - save_cache:
        name: Restore Emacs deps
        key: cask-{{checksum Cask}}
        paths:
          - ~/.emacs.d

# Enumerated list of Emacs versions
jobs:
  test-emacs-25:
    docker:
      - image: silex/emacs:25
        entrypoint: bash
    <<: *default-steps

  test-emacs-26:
    docker:
      - image: silex/emacs:26
        entrypoint: bash
    <<: *default-steps

  test-emacs-27:
    docker:
      - image: silex/emacs:27
        entrypoint: bash
    <<: *default-steps

  test-emacs-28:
    docker:
      - image: silex/emacs:28
        entrypoint: bash
    <<: *default-steps

  test-emacs-29:
    docker:
      - image: silex/emacs:29
        entrypoint: bash
    <<: *default-steps

  test-emacs-30:
    docker:
      - image: silex/emacs:30
        entrypoint: bash
    <<: *default-steps

  test-emacs-master:
    docker:
      - image: silex/emacs:master
        entrypoint: bash
    <<: *default-steps

  test-plantuml-server:
    docker:
      - image: silex/emacs:30
        entrypoint: bash
      ## Server listens at port 8080
      - image: plantuml/plantuml-server:jetty
    steps:
      - restore_cache:
        name: Restore Emacs deps
        keys:
          - cask-{{checksum Cask}}
    - run:
        name: Install cask
        command: curl -fsSL https://raw.githubusercontent.com/cask/cask/master/go | python3
      - run:
        name: Make Cask available on the path
        command: echo 'export PATH="/root/.cask/bin:$PATH"' >> $BASH_ENV
      - run:
        name: Run the tests
        command: make version integration
      - run:
        name: Download Cask deps
        command: cask install
      - save_cache:
        name: Restore Emacs deps
        key: cask-{{checksum Cask}}
        paths:
          - ~/.emacs.d

# Executing in parallel
workflows:
  version: 2
  ci-test-matrix:
    jobs:
      - test-emacs-25
      - test-emacs-26
      - test-emacs-27
      - test-emacs-28
      - test-emacs-29
      - test-emacs-30
      # Testing against master currently hangs on CircleCI
      # - test-emacs-master
  server:
    jobs:
      - test-plantuml-server
